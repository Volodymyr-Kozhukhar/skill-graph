services:
  # PostgreSql service
  db:
    image: "postgres:18"

    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
    - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql


volumes:
  postgres_data: